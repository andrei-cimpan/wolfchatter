name: CI

# Every branch push runs CI, which also covers PR branches in this single-owner repo.
on:
  push:
  workflow_dispatch:

# The local Supabase stack, without the containers no test uses, which saves pulling them.
env:
  SUPABASE_EXCLUDE: studio,postgres-meta,imgproxy,storage-api,edge-runtime,logflare,vector,mailpit,supavisor

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same exact version as local development (nvm use).
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Start the local Supabase stack
        run: npx supabase start -x "$SUPABASE_EXCLUDE"
      # `status -o env` quotes its values, which $GITHUB_ENV would keep, so the quotes are dropped.
      - name: Export its settings
        run: |
          npx supabase status -o env --override-name db.url=SUPABASE_DB_URL \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY 2>/dev/null \
            | sed -E 's/^([A-Z0-9_]+)="(.*)"$/\1=\2/' | grep -E '^[A-Z0-9_]+=' >> "$GITHUB_ENV"
      # `next typegen` loads next.config.ts, which requires the Supabase settings exported above.
      - run: npm run typecheck
      # cacheComponents prerender errors only surface at build time.
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same exact version as local development (nvm use).
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start the local Supabase stack
        run: npx supabase start -x "$SUPABASE_EXCLUDE"
      - name: Export its settings
        run: |
          npx supabase status -o env --override-name db.url=SUPABASE_DB_URL \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY 2>/dev/null \
            | sed -E 's/^([A-Z0-9_]+)="(.*)"$/\1=\2/' | grep -E '^[A-Z0-9_]+=' >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
