name: CI

# Every branch push runs CI, which also covers PR branches in this single-owner repo.
on:
  push:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wolfchatter
          POSTGRES_PASSWORD: wolfchatter
          POSTGRES_DB: wolfchatter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U wolfchatter -d wolfchatter"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://wolfchatter:wolfchatter@localhost:5432/wolfchatter
      TEST_DATABASE_URL: postgres://wolfchatter:wolfchatter@localhost:5432/wolfchatter_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same exact version as local development (nvm use).
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # cacheComponents prerender errors only surface at build time.
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test

  # Nothing else builds the image, and shutdown only behaves this way under the production server.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile app up --build --wait --wait-timeout 300
      - name: The image serves the app and reports healthy
        run: |
          curl --fail --silent --show-error http://localhost:3000/health | grep '"status":"ok"'
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/
      - name: An open stream does not hold up shutdown
        run: bash scripts/check-docker-shutdown.sh
      - name: Health reports a database that is down
        run: |
          docker compose --profile app start app
          timeout 30 sh -c 'until curl --fail --silent http://localhost:3000/health; do sleep 1; done'
          docker compose stop db
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/health)" = 503
      - if: failure()
        run: docker compose --profile app logs

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wolfchatter
          POSTGRES_PASSWORD: wolfchatter
          POSTGRES_DB: wolfchatter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U wolfchatter -d wolfchatter"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://wolfchatter:wolfchatter@localhost:5432/wolfchatter
      # Playwright's global setup creates and migrates it; the dev server writes rooms there.
      E2E_DATABASE_URL: postgres://wolfchatter:wolfchatter@localhost:5432/wolfchatter_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same exact version as local development (nvm use).
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
