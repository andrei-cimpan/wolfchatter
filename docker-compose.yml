# Fixed so every checkout shares one container and volume name.
name: wolfchatter

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wolfchatter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wolfchatter}
      POSTGRES_DB: ${POSTGRES_DB:-wolfchatter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during first-run init a temporary socket-only server answers too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The profile keeps `docker compose up -d db` starting only the database.
  migrate:
    profiles: [app]
    build: &app-build
      context: .
      args:
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-}
        NEXT_PUBLIC_MAP_ATTRIBUTION: ${NEXT_PUBLIC_MAP_ATTRIBUTION:-}
    environment: &app-environment
      DATABASE_URL: postgres://${POSTGRES_USER:-wolfchatter}:${POSTGRES_PASSWORD:-wolfchatter}@db:5432/${POSTGRES_DB:-wolfchatter}
    command: ["node", "scripts/migrate.mts"]
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: [app]
    build: *app-build
    environment:
      <<: *app-environment
      # Blank means the app's default.
      RATE_LIMIT_ROOMS_PER_MINUTE: ${RATE_LIMIT_ROOMS_PER_MINUTE:-}
      RATE_LIMIT_MESSAGES_PER_MINUTE: ${RATE_LIMIT_MESSAGES_PER_MINUTE:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
